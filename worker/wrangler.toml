# ============================================================================
# Arsip23 API — Cloudflare Worker
#
# `id` KV di bawah SENGAJA dibiarkan kosong di repo. Isinya bukan rahasia
# (hanya pengenal namespace), tapi mengosongkannya membuat langkah setup gagal
# dengan keras dan jelas kalau dilewati — jauh lebih baik daripada diam-diam
# menulis ke namespace milik orang lain yang kebetulan ID-nya masih tertinggal
# di berkas ini.
#
# Cara mengisinya ada di README.md bagian "Setup Cloudflare".
# ============================================================================

name = "arsip23-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Variabel di bawah ini BUKAN rahasia — boleh masuk repo.
# Yang dipasang lewat `wrangler secret put` dan tidak pernah ditulis di sini:
#   GOOGLE_CLIENT_ID      (juga dipakai frontend; di sini untuk memeriksa `aud`)
#   GOOGLE_CLIENT_SECRET  RAHASIA
#   GOOGLE_REFRESH_TOKEN  RAHASIA — kunci ke seluruh isi arsip
[vars]
# Daftar asal yang boleh memanggil API ini, dipisah koma.
#
# arsip-gratis.my.id (dibeli 2026-08-11, lihat DECISIONS.md CP-26) adalah asal
# utama sekarang. URL GitHub Pages lama dipertahankan sebagai jaring pengaman
# selama masa transisi DNS — domain baru butuh waktu untuk propagasi, dan kalau
# dihapus sekarang situs bisa mati total di tengah migrasi tanpa jalan mundur.
ALLOWED_ORIGINS = "https://arsip-gratis.my.id,https://www.arsip-gratis.my.id,https://belvahector-ship-it.github.io,http://localhost:8788"

[[kv_namespaces]]
binding = "ARSIP_KV"
id = "1d040e2e658e489a8052998eb8a40c44"

[observability]
enabled = true
