<!-- Favicon Arsip23 — kotak gelap membulat dengan "23", turunan langsung dari
     .app-logo__mark di header (latar --ink #0F172A + teks krem --surface-cream
     #FFFDF5, sudut --r-lg 12px).

     Sengaja HANYA "23", bukan "ARSIP23" utuh: pada ukuran tab peramban
     (16-32px), "ARSIP23" akan jadi coretan yang tidak terbaca — favicon harus
     tetap jelas sebagai kotak solid dari jarak sekilas, bukan dibaca huruf
     demi huruf. "23" tetap membawa identitas yang sama karena warnanya persis
     warna kotak "ARSIP" di header situs.

     Radius 5 (bukan 12) karena viewBox ini 32 unit sementara logo di header
     ~30px tinggi: radius yang benar di sini adalah proporsi yang sama, bukan
     angka yang sama. Radius 12 pada kotak 32 unit akan mendekati lingkaran.

     BAYANGAN KERAS SENGAJA TIDAK IKUT, walaupun ia tanda tangan tema ini.
     Pada 16px, offset 2px adalah 12% lebar ikon: yang tergambar bukan kesan
     "melayang" melainkan kotak yang terlihat bergeser dan salah cetak. Ikon
     juga dirender di atas latar tab yang warnanya tidak kita ketahui — bisa
     gelap — sehingga bayangan gelapnya kadang lenyap sama sekali.

     Font sengaja bukan Space Grotesk (dimuat lewat @font-face di tokens.css):
     favicon dirender peramban di luar konteks halaman, tanpa jaminan font
     kustom ikut termuat — sans-serif bold bawaan sistem yang dipakai di sini
     supaya "23" selalu tampil tebal dan jelas, bukan kadang jatuh ke font
     tipis kalau font kustomnya gagal dimuat.

     Setiap kali berkas ini diubah, jalankan `node scripts/gen-icons.js` untuk
     menurunkan ulang PNG + ICO di assets/icons/ — kalau tidak, tab peramban
     modern memakai SVG yang baru sementara Windows/iOS masih memakai ikon
     lama, dan keduanya terlihat berdampingan dengan warna berbeda. -->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="5" ry="5" fill="#0F172A"/>
  <text
    x="16" y="17"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="16"
    letter-spacing="-0.5"
    fill="#FFFDF5"
    text-anchor="middle"
    dominant-baseline="middle"
  >23</text>
</svg>
